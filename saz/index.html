<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساز را بشناس · انجمن ایرانیان سوندبی‌بری</title>
<meta name="theme-color" content="#0f2a4a">
<style>
@font-face{font-family:"Vazirmatn";src:url("../takhte-shatranj/fonts/Vazirmatn-wght.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Lalezar";src:url("../takhte-shatranj/fonts/Lalezar-arabic.woff2") format("woff2");font-display:swap}
:root{--gold:#e2b04a;--gold2:#ffd98a;--ink:#f4ecd8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);background:#0b1f38 radial-gradient(ellipse at 50% 0,#1d4676 0,#0f2a4a 50%,#081829 100%) fixed;-webkit-tap-highlight-color:transparent}
.top{text-align:center;padding:12px 16px 18px;border-bottom:2px solid var(--gold);background:#081829cc}
.top a{display:block;text-align:start;color:var(--ink);text-decoration:none;font-size:13.5px;opacity:.9}
.top h1{margin:8px 0 2px;font-family:"Lalezar","Vazirmatn",sans-serif;font-weight:400;font-size:clamp(26px,6vw,38px);color:var(--gold2)}
.top p{margin:0;font-size:13px;opacity:.8}
main{max-width:900px;margin:0 auto;padding:18px 12px 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}
.c{background:#0a1d36d9;border:1px solid #e2b04a66;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,background .2s}
.c.on{border-color:var(--gold);background:#12315a}
.c img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e1d6c4}
.c .b{padding:10px 12px 12px}
.c h3{margin:0 0 8px;font-size:18px;color:var(--gold2)}
.pl{display:flex;align-items:center;gap:10px}
.btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#1b2147;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #a97d1f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a97d1f}
.btn:focus-visible,.bar:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn svg{width:20px;height:20px;fill:currentColor}
.pr{flex:1;min-width:0}
.bar{height:8px;border-radius:6px;background:#ffffff22;cursor:pointer;position:relative;direction:ltr}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(to right,var(--gold),var(--gold2))}
.tm{margin-top:4px;font-size:11.5px;opacity:.75;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.foot{text-align:center;padding:0 16px 30px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<header class="top"><a href="../index.html">→ بازگشت به تارنمای انجمن</a><h1>ساز را بشناس</h1><p>صدا و تصویر سازهای ایرانی</p></header>
<main id="m"></main>
<p class="foot">انجمن ایرانیان سوندبی‌بری · ۲۰۲۶</p>
<audio id="au" preload="none"></audio>
<script>
(function(){
var L=[["setar","سه‌تار"],["tar","تار"],["santur","سنتور"],["kamancheh","کمانچه"],["ney","نی"],["oud","عود"],["dotar","دوتار"],["tanbur","تنبور"],["divan","دیوان"],["tonbak","تنبک"],["daf","دف"]];
var D="۰۱۲۳۴۵۶۷۸۹";function fa(n){return String(n).replace(/\d/g,function(d){return D[d]})}
function fmt(t){if(!isFinite(t))return fa("0:00");var m=Math.floor(t/60),s=Math.floor(t%60);return fa(m+":"+(s<10?"0":"")+s)}
var P='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',Z='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
var au=document.getElementById("au"),m=document.getElementById("m"),cur=null,all=[];
L.forEach(function(it){
 var c=document.createElement("div");c.className="c";
 c.innerHTML='<img src="img/'+it[0]+'.jpg" alt="'+it[1]+'" loading="lazy"><div class="b"><h3>'+it[1]+'</h3><div class="pl"><button type="button" class="btn" aria-label="پخش '+it[1]+'">'+P+'</button><div class="pr"><div class="bar" tabindex="0" role="slider" aria-label="پیشرفت '+it[1]+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><div class="tm">'+fa("0:00")+'</div></div></div></div>';
 var o={c:c,btn:c.querySelector(".btn"),fill:c.querySelector(".bar i"),bar:c.querySelector(".bar"),tm:c.querySelector(".tm"),f:it[0]};
 o.btn.onclick=function(){toggle(o)};
 o.bar.onclick=function(e){if(cur!==o||!au.duration)return;var r=o.bar.getBoundingClientRect();au.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*au.duration};
 o.bar.onkeydown=function(e){if(cur!==o||!au.duration)return;if(e.key==="ArrowRight"){au.currentTime=Math.min(au.duration,au.currentTime+5);e.preventDefault()}else if(e.key==="ArrowLeft"){au.currentTime=Math.max(0,au.currentTime-5);e.preventDefault()}};
 m.appendChild(c);all.push(o);
});
function ui(o,play){o.c.classList.toggle("on",play||cur===o);o.btn.innerHTML=play?Z:P}
function reset(o){o.fill.style.width="0";o.tm.textContent=fa("0:00");o.c.classList.remove("on");o.btn.innerHTML=P}
function toggle(o){
 if(cur===o){au.paused?au.play():au.pause();return}
 if(cur)reset(cur);cur=o;au.src=o.f+".mp3";o.c.classList.add("on");
 var p=au.play();if(p&&p.catch)p.catch(function(){ui(o,false)});
}
au.addEventListener("play",function(){if(cur)ui(cur,true)});
au.addEventListener("pause",function(){if(cur&&!au.ended)ui(cur,false)});
au.addEventListener("timeupdate",function(){if(!cur||!au.duration)return;var p=au.currentTime/au.duration*100;cur.fill.style.width=p+"%";cur.tm.textContent=fmt(au.currentTime)+" / "+fmt(au.duration);cur.bar.setAttribute("aria-valuenow",String(Math.round(p)))});
au.addEventListener("ended",function(){if(cur){ui(cur,false);cur.c.classList.remove("on")}});
})();
</script>
</body>
</html>
