<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلاعات عمومی · انجمن ایرانیان سوندبی‌بری</title>
<meta name="theme-color" content="#e9f1fb">
<style>
@font-face{font-family:"Vazirmatn";src:url("../takhte-shatranj/fonts/Vazirmatn-wght.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Vazirmatn",Tahoma,sans-serif;color:#22303b;background:#eaf1fb;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
h1{margin:4px 4px 4px;font-size:26px}
.sub-t{margin:0 4px 16px;color:#566677;font-size:14px}
.card{background:#ffffffa8;border:1px solid #fff;border-radius:18px;padding:16px 12px 18px;box-shadow:0 8px 24px #3b6ea822}
.row{display:flex;align-items:center;gap:10px;margin:0 4px 6px}
.chip{font-size:13px;font-weight:700;padding:3px 14px;border-radius:999px;background:#fff;border:1px solid #ffffffcc;box-shadow:0 2px 6px #00000018}
.tag{font-size:13px;color:#566677}
.pts{margin-inline-start:auto;font-size:14px;font-weight:700}
.bars{display:flex;gap:5px;margin:0 4px 12px}.bars i{flex:1;height:5px;border-radius:3px;background:#d4dfec}.bars i.d{background:#22303b}.bars i.c{background:#94bf12}
.q{font-size:20px;font-weight:700;line-height:1.8;margin:6px 4px 14px}
.cf{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 18px}
.cf small{width:100%;font-size:12px;color:#566677}
.mini{font:inherit;font-size:13px;font-weight:700;line-height:20px;padding:4px 14px;border-radius:999px;background:#fffc;border:1px solid #ffffffcc;color:#22303b;box-shadow:0 2px 6px #00000014;cursor:pointer}
.mini.on{background:#22303b;color:#fff;border-color:#22303b}
.sub{display:block;width:100%;padding:4px 0;margin:0;list-style:none}
.sub li{position:relative;margin:0 0 12px}
.sub li:last-child{margin:0}
.pill{--to:left;position:relative;display:block;width:calc(100% - 18px);height:56px;padding:0 20px;padding-inline-start:98px;margin:0;margin-inline-start:18px;text-align:start;cursor:pointer;
font-family:inherit;color:#22303b;font-weight:700;font-size:19px;line-height:54px;white-space:nowrap;border-radius:999px;
background:
linear-gradient(to var(--to),color-mix(in srgb,var(--pc) 88%,transparent) 0 46px,color-mix(in srgb,var(--pc) 55%,transparent) 80px,transparent 124px) top/100% 30% no-repeat,
linear-gradient(to var(--to),color-mix(in srgb,var(--pc) 88%,transparent) 0 56px,color-mix(in srgb,var(--pc) 40%,transparent) 100px,transparent 136px) 0 40%/100% 25% no-repeat,
linear-gradient(to var(--to),color-mix(in srgb,var(--pc) 88%,transparent) 0 42px,color-mix(in srgb,var(--pc) 50%,transparent) 74px,transparent 112px) bottom/100% 40% no-repeat,
linear-gradient(180deg,#ffffffe6,#ffffffa6);
border:1px solid #ffffffcc;box-shadow:inset 0 1px 0 #fff,0 3px 10px #00000022;transition:transform .18s,filter .3s}
.pill::before{content:attr(data-l);position:absolute;top:50%;inset-inline-start:-18px;width:70px;height:70px;margin-top:-35px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px #0005;line-height:1;
background:radial-gradient(circle at 35% 28%,#ffffffb8 0,#fff0 46%),linear-gradient(150deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 60%,color-mix(in srgb,var(--pc) 78%,#000));
opacity:.97;border:2px solid #ffffff90;box-shadow:0 4px 12px color-mix(in srgb,var(--pc) 45%,#0003)}
@media (hover:hover){.pill:hover{transform:translateX(-4px)}}
.pill:focus-visible{outline:2px solid var(--pc);outline-offset:3px}
.pill.ok{box-shadow:inset 0 1px 0 #fff,0 0 0 3px #2e9e5b;transform:none}
.pill.no{box-shadow:inset 0 1px 0 #fff,0 0 0 3px #d64545;transform:none}
.pill.dim{filter:saturate(.25);transform:none}
.pill.dim::before{box-shadow:none}
.pill.ok,.pill.no,.pill.dim{pointer-events:none}
.pill .m{position:absolute;top:0;inset-inline-end:20px;font-size:22px;font-weight:700}
.pill.ok .m{color:#1f7a44}.pill.no .m{color:#b02a2a}
.fb{margin:16px 4px 0;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.9;background:#ffffffd9;border:1px solid #fff;box-shadow:0 2px 6px #00000014}
.fb b{display:block;margin-bottom:2px}
.dl{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;margin-inline-start:8px;color:#fff}
.act{margin:14px 4px 0}
.big{font-size:28px;font-weight:700;margin:4px 4px 10px}
.lv{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-size:14px}
.hint{font-size:12.5px;color:#566677;margin:14px 4px 0;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html" style="display:inline-block;color:#566677;text-decoration:none;font-size:13px;margin:0 4px 6px">→ بازگشت به تارنمای انجمن</a>
<h1>اطلاعات عمومی</h1>
<p class="sub-t">پرسش‌هایی از سراسر جهان، در سه سطح</p>
<div class="card" id="card"></div>
</div>
<script>
(function(){
"use strict";
var FD="۰۱۲۳۴۵۶۷۸۹";function fa(n){return String(n).replace(/\d/g,function(d){return FD[d]})}
var LV={e:{n:"آسان",c:"#94bf12",t:"#4d6a05",p:1},m:{n:"متوسط",c:"#f27a10",t:"#a15c00",p:2},h:{n:"دشوار",c:"#dc3d92",t:"#a31f6a",p:3}};
var ALL=[
{l:"e",c:"جغرافیا",q:"پایتخت استرالیا کدام شهر است؟",o:["سیدنی","ملبورن","کانبرا","پرت"],a:2,x:"کانبرا پایتخت است. سیدنی بزرگ‌ترین شهر استرالیاست و بسیاری آن را پایتخت می‌پندارند."},
{l:"e",c:"نجوم",q:"بزرگ‌ترین سیاره در سامانهٔ خورشیدی کدام است؟",o:["کیوان","مشتری","نپتون","زمین"],a:1,x:"شعاع مشتری حدود یازده برابر زمین است. کیوان همان زحل است و دومین سیارهٔ بزرگ به شمار می‌آید."},
{l:"m",c:"تاریخ",q:"نخستین انسانی که به فضا رفت چه کسی بود؟",o:["نیل آرمسترانگ","یوری گاگارین","بز آلدرین","والنتینا ترشکووا"],a:1,x:"گاگارین در ۱۲ آوریل ۱۹۶۱ به مدار زمین رسید. ترشکووا در ۱۹۶۳ نخستین زن در فضا شد."},
{l:"m",c:"تاریخ",q:"دیوار برلین در چه سالی فروریخت؟",o:["۱۹۸۱","۱۹۸۹","۱۹۹۱","۱۹۹۵"],a:1,x:"دیوار در نوامبر ۱۹۸۹ باز شد و یک سال بعد آلمان یکی شد."},
{l:"h",c:"علوم",q:"کدام دانشمند در دو رشتهٔ علمی متفاوت جایزهٔ نوبل گرفته است؟",o:["آلبرت اینشتین","ماری کوری","نیلز بور","لینوس پاولینگ"],a:1,x:"ماری کوری در ۱۹۰۳ نوبل فیزیک و در ۱۹۱۱ نوبل شیمی گرفت. پاولینگ نوبل شیمی و صلح گرفت و این دو رشتهٔ علمی نیستند."},
{l:"h",c:"جغرافیا",q:"پایتخت کنونی قزاقستان کدام شهر است؟",o:["آلماتی","آستانه","بیشکک","تاشکند"],a:1,x:"آستانه پایتخت است. آلماتی تا سال ۱۹۹۷ پایتخت بود."}
];
var card=document.getElementById("card"),list=[],i=0,score=0,mode="guess",done=false,by={e:0,m:0,h:0};
function pill(t,l,pc){return '<li style="--pc:'+pc+'"><button type="button" class="pill" data-l="'+l+'">'+t+'</button></li>'}
function menu(){
 card.innerHTML='<p class="q" style="margin-top:0">سطح را انتخاب کنید</p><ul class="sub" id="ul"></ul><p class="hint">پیش از هر پاسخ می‌توانید بگویید مطمئن هستید: پاسخ درست امتیاز را دو برابر می‌کند و پاسخ غلط یک امتیاز کم می‌کند.</p>';
 var ul=document.getElementById("ul"),items=[["all","همهٔ سطح‌ها","#11959b"],["e","آسان","#94bf12"],["m","متوسط","#f27a10"],["h","دشوار","#dc3d92"]];
 items.forEach(function(it){ul.insertAdjacentHTML("beforeend",pill(it[1],"",it[2]))});
 ul.querySelectorAll("button").forEach(function(b,k){b.onclick=function(){start(items[k][0])}});
}
function start(k){list=ALL.filter(function(q){return k==="all"||q.l===k});i=0;score=0;by={e:0,m:0,h:0};show()}
function show(){
 if(i>=list.length)return fin();
 done=false;mode="guess";var q=list[i],L=LV[q.l];
 var bars="";list.forEach(function(z,k){bars+='<i class="'+(k<i?"d":k===i?"c":"")+'"></i>'});
 var h='<div class="bars">'+bars+'</div><div class="row"><span class="chip" style="color:'+L.t+'">'+L.n+'</span><span class="tag">'+q.c+'</span><span class="pts">امتیاز: '+fa(score)+'</span></div><p class="q">'+q.q+'</p><div class="cf" id="cf"></div><ul class="sub" id="ul"></ul><div id="out"></div>';
 card.innerHTML=h;tabs();
 var ul=document.getElementById("ul"),LT=["الف","ب","ج","د"],cols=["#94bf12","#11959b","#6a52cf","#dc3d92"];
 q.o.forEach(function(t,j){ul.insertAdjacentHTML("beforeend",pill(t,LT[j],cols[j]))});
 ul.querySelectorAll("button").forEach(function(b,j){b.onclick=function(){pick(j)}});
}
function tabs(){
 var cf=document.getElementById("cf");cf.innerHTML='<small>پیش از پاسخ، اطمینانتان را بگویید.</small>';
 [["guess","حدس می‌زنم"],["sure","مطمئنم · امتیاز دو برابر، غلط منفی یک"]].forEach(function(t){
  var b=document.createElement("button");b.type="button";b.className="mini"+(t[0]===mode?" on":"");b.textContent=t[1];
  b.onclick=function(){if(done)return;mode=t[0];tabs()};cf.appendChild(b)})
}
function pick(j){
 if(done)return;done=true;var q=list[i],bs=document.querySelectorAll("#ul .pill"),ok=j===q.a;
 bs.forEach(function(b,k){if(k!==q.a&&k!==j)b.classList.add("dim")});
 bs[q.a].classList.add("ok");bs[q.a].insertAdjacentHTML("beforeend",'<span class="m">✓</span>');
 if(!ok){bs[j].classList.add("no");bs[j].insertAdjacentHTML("beforeend",'<span class="m">✕</span>')}
 var base=LV[q.l].p,d=ok?(mode==="sure"?base*2:base):(mode==="sure"?-1:0);
 score+=d;if(ok)by[q.l]++;
 document.querySelector(".pts").textContent="امتیاز: "+(score<0?"−":"")+fa(Math.abs(score));
 document.getElementById("out").innerHTML='<div class="fb"><b style="color:'+(ok?"#1f7a44":"#b02a2a")+'">'+(ok?"درست است":"درست نبود")+'<span class="dl" style="background:'+(d>0?"#2e9e5b":d<0?"#d64545":"#8a97a5")+'">'+(d>0?"+":d<0?"−":"")+fa(Math.abs(d))+' امتیاز</span></b>'+q.x+'</div><div class="act"><button type="button" class="mini" id="nx">'+(i===list.length-1?"دیدن نتیجه":"پرسش بعدی")+'</button></div>';
 document.getElementById("nx").onclick=function(){i++;show()};
}
function fin(){
 var h='<p class="tag" style="margin:0">پایان</p><p class="big">امتیاز شما: '+fa(score)+'</p>';
 ["e","m","h"].forEach(function(l){var n=list.filter(function(q){return q.l===l}).length;if(n)h+='<div class="lv"><span class="chip" style="color:'+LV[l].t+'">'+LV[l].n+'</span><span>'+fa(by[l])+' از '+fa(n)+'</span></div>'});
 h+='<div class="act"><button type="button" class="mini" id="rs">دوباره بازی کن</button></div>';
 card.innerHTML=h;document.getElementById("rs").onclick=menu;
}
menu();
})();
</script>
</body>
</html>
