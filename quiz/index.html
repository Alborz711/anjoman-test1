 ir:["ایران","Iran"],wd:["جهان","Världen"],
 rulesT:["قوانین و امتیاز","Regler och poäng"],

 r6:["نام و راه تماس فقط برای اعلام برندگان نگه‌داری می‌شود.","Namn och kontaktuppgift sparas enbart för att kunna meddela vinnarna."],

};
var S={lang:"both",name:"",contact:"",sid:"",consent:false,ans:{medium:{},hard:{}},pos:{medium:0,hard:0},sent:{medium:false,hard:false}};
try{var raw=JSON.parse(localStorage.getItem(STORE)||"null");if(raw)for(var k in raw)S[k]=raw[k]}catch(e){}
if(!S.sid){S.sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bi(a,b){var l=S.lang;if(l==="fa")return esc(a);if(l==="sv")return esc(b);return esc(a)+'<span class="sv" lang="sv" dir="ltr">'+esc(b)+"</span>"}
function u(k){return bi(UI[k][0],UI[k][1])}

  document.documentElement.dir=S.lang==="sv"?"ltr":"rtl";document.documentElement.lang=S.lang==="sv"?"sv":"fa";

  h+='<div class="hp" aria-hidden="true"><label>Website<input id="website" type="text" tabindex="-1" autocomplete="off"></label></div>';

    if(!k){S.name=n;S.contact=c;return form(lv,u("errCons"))}
    S.name=n;S.contact=c;S.consent=true;save();quiz(lv,S.pos[lv]||0);
  });
}
function quiz(lv,i){

  h+='<div class="bars" aria-hidden="true">'+bars+"</div>";
  h+='<div class="row" style="margin-bottom:0"><span class="tag">'+plain("q")+" "+(i+1)+" "+plain("of")+" "+n+"</span></div>";
  h+='<div class="q" id="qq">'+bi(it.q.fa,it.q.sv)+'</div><ul class="sub" role="radiogroup" aria-labelledby="qq">';
  it.o.forEach(function(o,k){var L1="ABCD"[k];h+='<li><button type="button" class="pill" role="radio" aria-checked="'+(A[it.id]===L1)+'" data-pick="'+L1+'" data-l="'+lab(k)+'" style="--pc:'+COL[k]+'">'+bi(o.fa,o.sv)+"</button></li>"});
  h+='</ul><div class="nav"><button type="button" class="mini" data-nav="-1"'+(i===0?" disabled":"")+">"+(S.lang==="sv"?"‹ ":"› ")+u("prev")+'</button><span class="mid">'+Object.keys(A).length+"/"+n+'</span><button type="button" class="mini go" data-nav="1">'+(i===n-1?u("review"):u("next")+(S.lang==="sv"?" ›":" ‹"))+"</button></div></div>";
  h+='<button type="button" class="mini" data-review="1">'+u("review")+"</button>";
  APP.innerHTML=h;window.scrollTo(0,0);
}
function reviewV(lv){
  var L=items(lv),A=S.ans[lv],c=Object.keys(A).length,n=L.length;
  var h='<div class="big">'+u("revT")+'</div><div class="card"><div class="row"><span class="chip">'+c+" "+plain("answered")+'</span><span class="chip">'+(n-c)+" "+plain("unans")+"</span></div>";
  h+='<div class="grid">'+L.map(function(x,i){return '<button type="button" class="'+(A[x.it.id]?"a":"")+'" data-jump="'+i+'">'+(i+1)+"</button>"}).join("")+"</div>";
  h+='<div class="hint">'+u("revH")+'</div><div id="msg"></div><div class="nav"><button type="button" class="mini" data-nav="-1">'+u("prev")+'</button><button type="button" class="mini go" id="send" data-send="1">'+u("send")+"</button></div></div>";
  APP.innerHTML=h;window.scrollTo(0,0);
}
function thanks(just,test){
  var h='<div class="card"><div class="big">'+u("thanks")+'</div><p class="lead">'+u("thanksD")+"</p>"+(test?'<div class="okb">'+u("test")+"</div>":"")+'<button class="mini go" data-go="home">'+u("again")+"</button></div>";
  APP.innerHTML=h;
}
function send(lv){
  var A=S.ans[lv],c=Object.keys(A).length,n=items(lv).length;
  if(c<n&&!window.confirm(plain("confirm")))return;
  var btn=document.getElementById("send"),msg=document.getElementById("msg");
  btn.disabled=true;btn.innerHTML=u("sending");msg.innerHTML="";
  var hp=S.hp?"x":"";
  var payload={v:1,level:lv,sid:S.sid,name:S.name,contact:S.contact,lang:S.lang,website:hp,answers:A};
  function fail(k){btn.disabled=false;btn.innerHTML=u("send");msg.innerHTML='<div class="err" role="alert">'+u(k)+"</div>"}
  function ok(test){S.sent[lv]=true;S.ans[lv]={};S.pos[lv]=0;save();thanks(true,test)}
  if(!ENDPOINT){try{var ob=JSON.parse(localStorage.getItem("anjoman-quiz-outbox")||"[]");ob.push(payload);localStorage.setItem("anjoman-quiz-outbox",JSON.stringify(ob))}catch(e){}ok(true);return}
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
   .then(function(r){return r.json()})
   .then(function(j){if(j&&j.ok)ok(false);else if(j&&j.error==="duplicate"){fail("errDup")}else fail("errInv")})
   .catch(function(){fail("errNet")});
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.lang){S.lang=t.dataset.lang;save();applyLang();return refresh()}
  if(t.dataset.go){var g=t.dataset.go;if(g==="home"){history.replaceState(null,"",location.pathname);return home()}location.hash=g;return}
  if(t.dataset.pick){var L=items(cur),it=L[S.pos[cur]].it;if(S.ans[cur][it.id]===t.dataset.pick)delete S.ans[cur][it.id];else S.ans[cur][it.id]=t.dataset.pick;save();return quiz(cur,S.pos[cur])}
  if(t.dataset.nav){var inRev=!!document.getElementById("send");var p=inRev?items(cur).length-1:S.pos[cur]+Number(t.dataset.nav);return quiz(cur,p)}
  if(t.dataset.review)return reviewV(cur);
  if(t.dataset.jump)return quiz(cur,Number(t.dataset.jump));
  if(t.dataset.send)return send(cur);
});
function refresh(){
  if(!DATA)return;
  var rv=document.getElementById("send"),h=location.hash.replace("#","");
  if(h==="rules")return rules();
  if(h==="medium"||h==="hard"){if(S.sent[h])return thanks(false);if(!S.name||!S.contact||!S.consent)return form(h,"");return rv?reviewV(h):quiz(h,S.pos[h]||0)}
  home();
}
window.addEventListener("hashchange",function(){route()});
applyLang();
fetch("questions.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){DATA=d;route()}).catch(function(){APP.innerHTML='<div class="err">questions.json</div>'});
})();
</script>
</body>
</html>
