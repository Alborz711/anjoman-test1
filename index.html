<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>دارت حرفه‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: a warm pub game night, polished like a store-ready mobile game
   IDEA: a real tournament dartboard hanging on a lit wooden wall
   PICTURE: the board itself — sisal fibres, chrome wire spider, metal numbers, 3D darts
   COLOUR and TYPE: walnut wood, board red/green/cream, gold for scores; Vazirmatn 900 for numbers
   LAYOUT: score cards on top, board centred, the dart in your hand at the bottom */
:root{color-scheme:dark;--gold:#f5c451;--cy:50vh;--rt:160px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0705;overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;color:#f6eee2;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:10px;justify-content:center;pointer-events:none;z-index:2}
.card{flex:1;max-width:290px;background:linear-gradient(180deg,rgba(46,32,22,.82),rgba(14,10,8,.82));border:1px solid rgba(255,220,160,.14);border-radius:16px;padding:7px 12px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);transition:all .3s;opacity:.7}
.card.on{opacity:1;border-color:rgba(245,196,81,.8);box-shadow:0 0 0 1px rgba(245,196,81,.3),0 10px 30px rgba(0,0,0,.5),0 0 26px rgba(245,196,81,.2)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#e6d8c2;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:middle;box-shadow:0 0 8px currentColor}
.big{font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.15;background:linear-gradient(180deg,#fff8e4,#f5c451 55%,#c8891e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.chips{display:flex;gap:4px;margin-top:2px}
.chip{flex:1;text-align:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.08);border-radius:8px;padding:1px 0;min-height:22px;color:#fff3d6}
.sub{font-size:13px;color:#b9a991;font-weight:400}
#pop{position:fixed;left:0;right:0;top:calc(var(--cy) - var(--rt)*.42);text-align:center;pointer-events:none;z-index:3;opacity:0}
#pop b{display:block;font-size:clamp(30px,9vw,48px);font-weight:900;color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.9)}
#pop span{display:inline-block;font-size:22px;font-weight:900;color:#2a1600;background:linear-gradient(180deg,#ffe39a,#f0a92a);padding:0 14px;border-radius:20px;box-shadow:0 4px 0 #7a4c08,0 8px 18px rgba(0,0,0,.5)}
#pop.hot b{color:#ffd45a;text-shadow:0 3px 0 #6b3a00,0 0 26px rgba(255,170,40,.9)}
#pop.miss b{color:#cfc6b8}#pop.miss span,#pop.bad span{background:linear-gradient(180deg,#ff8a8a,#d02a3a);color:#fff;box-shadow:0 4px 0 #6d0b14}
#pop.go{animation:pop 1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.15)}28%{transform:scale(1)}72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
#banner{position:fixed;left:50%;top:var(--cy);transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;opacity:0;padding:16px 34px;border-radius:22px;background:linear-gradient(180deg,rgba(40,26,16,.92),rgba(12,8,6,.92));border:1px solid rgba(245,196,81,.5);box-shadow:0 20px 60px rgba(0,0,0,.7);white-space:nowrap}
#banner b{display:block;font-size:clamp(34px,10vw,56px);font-weight:900;line-height:1.1}
#banner small{font-size:15px;color:#cdbda4}
#banner.gold b{background:linear-gradient(180deg,#fff6d0,#f5c451 50%,#d58a12);-webkit-background-clip:text;background-clip:text;color:transparent}
#banner.bad b{color:#ff5a6a}
#banner.go{animation:ban 1.15s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
#hint{position:fixed;left:0;right:0;top:calc(var(--cy) + var(--rt) + 4px);text-align:center;font-size:14px;color:#e8d9c0;text-shadow:0 2px 6px #000;pointer-events:none;z-index:2;transition:opacity .5s}
#mb{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,220,160,.2);background:rgba(20,14,10,.75);color:#f3e6cf;display:none;place-items:center;z-index:5;cursor:pointer}
#mb:focus-visible,.btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid #ffd45a;outline-offset:2px}
.screen{position:fixed;inset:0;display:none;place-items:start center;padding-top:60px !important;z-index:10;background:radial-gradient(ellipse at 50% 40%,rgba(10,6,4,.45),rgba(5,3,2,.88));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:16px;overflow:auto}
.screen.show{display:grid;animation:fade .35s ease}
@keyframes fade{from{opacity:0}}
.panel{margin:auto 0;width:min(420px,100%);background:linear-gradient(180deg,rgba(52,36,24,.95),rgba(20,14,10,.96));border:1px solid rgba(245,196,81,.35);border-radius:26px;padding:22px 20px 18px;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);text-align:center}
.logo{width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));margin-top:-62px}
h1{margin:2px 0 0;font-size:52px;font-weight:900;line-height:1.05;background:linear-gradient(180deg,#fff6d6,#f5c451 55%,#c8891e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2004)}
h2{margin:4px 0 12px;font-size:34px;font-weight:900;color:#ffd45a}
.tag{margin:4px 0 18px;color:#cdbda4;font-size:15px}
.btn{display:block;width:100%;min-height:54px;margin:10px 0;border:0;border-radius:16px;font:800 18px Vazirmatn,Tahoma,sans-serif;color:#2a1600;cursor:pointer;background:linear-gradient(180deg,#ffdf7a,#f0a92a);box-shadow:0 5px 0 #8a5a0c,0 12px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a0c,0 6px 12px rgba(0,0,0,.4)}
.btn.alt{color:#fff;background:linear-gradient(180deg,#e2394f,#a3112a);box-shadow:0 5px 0 #5c0715,0 12px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.alt:active{box-shadow:0 1px 0 #5c0715}
.btn.green{color:#fff;background:linear-gradient(180deg,#2bc06a,#0f7f3e);box-shadow:0 5px 0 #064421,0 12px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.blue{color:#fff;background:linear-gradient(180deg,#4b95ff,#1d5bd0);box-shadow:0 5px 0 #0d2f73,0 12px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.green:active,.btn.blue:active{box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn.dark{color:#f3e6cf;background:linear-gradient(180deg,#4a382b,#2a1f18);box-shadow:0 5px 0 #120c08,0 12px 24px rgba(0,0,0,.45)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:15px;text-align:start;cursor:pointer}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:#cdbda4;font:600 14px Vazirmatn,Tahoma,sans-serif;padding:8px 10px;border-radius:9px;cursor:pointer;min-height:38px}
.seg button.on{background:linear-gradient(180deg,#ffdf7a,#f0a92a);color:#2a1600;font-weight:800}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:30px;background:#3a2f28;position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::before{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#e8dcc8;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.sw:checked{background:#1f9d55}.sw:checked::before{transform:translateX(-22px)}
[dir=ltr] .sw::before{right:auto;left:3px}[dir=ltr] .sw:checked::before{transform:translateX(22px)}
details{margin-top:12px;text-align:start;font-size:14px;color:#cdbda4;line-height:1.8}
summary{cursor:pointer;color:#f3e6cf;font-weight:600;padding:4px 0}
.stats{display:grid;gap:8px;margin-bottom:8px}
.st{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:16px}
.st b{color:#ffd45a;font-weight:900}
</style>
</head>

  <label class="row"><span data-i="dblL"></span><input type="checkbox" id="dbl" class="sw"></label>
  <label class="row"><span data-i="sndL"></span><input type="checkbox" id="snd" class="sw"></label>

</div></div>

</div></div>

{

const T=(key,...a)=>{const v=(L[settings.lang]||L.fa)[key];return typeof v==='function'?v(...a):v};
const L={
fa:{title:'دارت',tag:'نگه دار تا نشانه بگیری، رها کن تا پرتاب شود',hint:'انگشت را روی صفحه نگه دار، نشانه بگیر و رها کن',
m501:'بازی ۵۰۱ مقابل کامپیوتر',m501p:'۵۰۱ دونفره روی یک گوشی',mcount:'امتیازگیری؛ ۸ دور',matc:'دور ساعت؛ ۱ تا ۲۰ و بول',
langL:'زبان',lvl:'سطح کامپیوتر',easy:'آسان',mid:'متوسط',pro:'حرفه‌ای',dblL:'پایان با دوبل (قانون رسمی)',sndL:'صدا',helpT:'راهنمای بازی',
help:'انگشت یا موس را روی صفحه نگه دار؛ نشانگر کمی بالاتر از انگشت ظاهر می‌شود. آن را روی هدف ببر و رها کن. هرچه بیشتر نگه داری دستت بیشتر می‌لرزد، پس سریع تصمیم بگیر.<br>حلقهٔ باریک داخلی سه‌برابر و حلقهٔ بیرونی دوبرابر امتیاز دارد. مرکز ۵۰ و حلقهٔ سبز دور آن ۲۵ است.<br>در ۵۰۱ باید امتیازت را دقیقاً به صفر برسانی. اگر بیشتر از باقی‌مانده بزنی «می‌سوزی» و امتیاز آن نوبت حساب نمی‌شود.<br>در حالت دونفره هر بازیکن سه پرتاب می‌کند و بعد گوشی را به نفر بعد می‌دهد.<br>در دور ساعت باید به ترتیب ۱ تا ۲۰ و در آخر بول را بزنی. خانهٔ هدف روی صفحه می‌درخشد و هر خانه‌ای از آن عدد (تک، دوبل یا سه‌برابر) قبول است. هرچه با پرتاب کمتری تمام کنی بهتر است.',
again:'دوباره بازی کن',toMenu:'منوی اصلی',bullHit:'بول!',bull:'بول',outer:'بول بیرونی',miss:'بیرون',treble:n=>'سه‌برابر '+n,double:n=>'دوبل '+n,
you:'شما',cpu:'کامپیوتر',player:n=>'بازیکن '+n,turnOf:n=>'نوبت '+n,pass:'گوشی را به او بده',bust:'سوخت!',done:'تمام!',next:n=>'بعدی: '+n,wrong:'خطا',

bestFew:'بهترین رکورد (کمترین پرتاب)',gameOver:'پایان بازی',final:'امتیاز نهایی',avgRound:'میانگین هر نوبت',best:'بهترین رکورد',
avg:n=>'میانگین '+n,throws:n=>'پرتاب '+n,round:(a,b)=>'دور '+a+' از '+b,target:n=>'هدف '+n,nth:(a,b)=>'پرتاب '+a+' از '+b,yourRec:'رکورد شما',throws24:'۲۴ پرتاب',fewest:'کمترین پرتاب'},
sv:{title:'Dart',tag:'Håll för att sikta, släpp för att kasta',hint:'Håll fingret på skärmen, sikta och släpp',
m501:'501 mot datorn',m501p:'501 för två på en mobil',mcount:'Poängjakt – 8 rundor',matc:'Runt klockan – 1 till 20 och bull',
langL:'Språk',lvl:'Datorns nivå',easy:'Lätt',mid:'Medel',pro:'Proffs',dblL:'Avsluta på dubbel (officiell regel)',sndL:'Ljud',helpT:'Så spelar du',
help:'Håll fingret eller musen på skärmen; siktet visas en bit ovanför fingret. Flytta det till målet och släpp. Ju längre du håller, desto mer darrar handen – så bestäm dig snabbt.<br>Den smala inre ringen ger trippel och den yttre ringen dubbel poäng. Mitten (bull) ger 50 och den gröna ringen runt den 25.<br>I 501 ska du räkna ner exakt till noll. Kastar du mer än det som återstår blir det bust och rundans poäng räknas inte.<br>I läget för två kastar varje spelare tre pilar och lämnar sedan över mobilen.<br>I Runt klockan ska du träffa 1 till 20 i ordning och sist bull. Målfältet lyser på tavlan och alla delar av siffran (singel, dubbel eller trippel) godkänns. Ju färre kast, desto bättre.',
again:'Spela igen',toMenu:'Huvudmeny',bullHit:'Bull!',bull:'Bull',outer:'Yttre bull',miss:'Miss',treble:n=>'Trippel '+n,double:n=>'Dubbel '+n,
you:'Du',cpu:'Datorn',player:n=>'Spelare '+n,turnOf:n=>'Tur: '+n,pass:'Lämna över mobilen',bust:'Bust!',done:'Klart!',next:n=>'Nästa: '+n,wrong:'Fel',

};
function applyLang(){
  const sv=settings.lang==='sv',de=document.documentElement;de.lang=sv?'sv':'fa';de.dir=sv?'ltr':'rtl';
  document.title=sv?'Dart':'دارت حرفه‌ای';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T(el.dataset.i);if(el.dataset.html)el.innerHTML=v;else el.textContent=v});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.lang));
  if(W)makeBoard();
}
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const RB=6.35,ROB=16,TI=99,TO=107,DI=162,DO=170,RN=226,EXT=RN*1.17,DEG=Math.PI/180;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#c'),ctx=cv.getContext('2d'),hud=$('#hud');
let W,H,dpr,cx,cy,R,Rt,k,s0,hs,hudH,botH,bgC,boardC;
let state='menu',G=null,darts=[],parts=[],flight=null,aim=null,cpu=null,cpuLast=null,shake=0,t=0,gid=0,collecting=0,collectCb=null,last=performance.now(),thrown=0;
const store={get(a,d){try{const v=localStorage.getItem(a);return v==null?d:JSON.parse(v)}catch(e){return d}},set(a,v){try{localStorage.setItem(a,JSON.stringify(v))}catch(e){}}};
const settings=Object.assign({diff:1,dbl:false,snd:true,lang:'fa'},store.get('darts-set',{}));
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

function scoreAt(x,y){
  const r=Math.hypot(x,y);
  if(r<=RB)return{v:50,m:2,n:50,lab:T('bullHit'),chip:T('bull')};
  if(r<=ROB)return{v:25,m:1,n:25,lab:T('outer'),chip:fa(25)};
  if(r>DO)return{v:0,m:0,n:0,lab:T('miss'),chip:fa(0)};

let AC=null,NB=null;
function audioInit(){if(AC||!settings.snd)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}

function snd(n){
  if(!settings.snd)return;audioInit();if(!AC)return;if(AC.state==='suspended')AC.resume();
  try{switch(n){
    case'whoosh':noise(.32,500,2600,1.2,.35);break;
    case'thud':tone(.14,170,55,.7);noise(.05,3200,1500,.8,.3,'highpass');break;
    case'soft':tone(.1,130,60,.4);break;
    case'miss':tone(.08,420,210,.2,'triangle');tone(.15,180,90,.3,'sine',.3);break;
    case'ding':tone(.35,1320,1318,.16,'triangle');tone(.5,1980,1975,.09,'sine',.07);break;
    case'bust':tone(.55,330,100,.2,'sawtooth');break;
    case'cheer':[523,659,784,1047].forEach((f,i)=>tone(.55,f,f*1.001,.13,'triangle',i*.09));noise(1.6,900,1500,.6,.22,'bandpass',.1);break;
    case'pull':noise(.18,1800,700,1,.14);break;
    case'click':tone(.05,900,700,.1,'triangle');break;
  }}catch(e){}
}

/* ---------- game ---------- */
const P=(name,col,isCpu,score)=>({name,col,cpu:isCpu,score,darts:0,total:0,hits:[]});
function later(ms,fn){const id=gid;setTimeout(()=>{if(id===gid&&state==='play')fn()},ms)}
function newGame(mode){
  gid++;state='play';darts=[];parts=[];flight=null;aim=null;cpu=null;cpuLast=null;collecting=0;
  const RED='#e0253f',BLUE='#2f7bf0';
  const players=mode==='501'?[P(T('you'),RED,false,501),P(T('cpu'),BLUE,true,501)]:mode==='501p'?[P(T('player',fa(1)),RED,false,501),P(T('player',fa(2)),BLUE,false,501)]:[P(T('you'),RED,false,0)];
  if(mode==='atc')players[0].target=1;
  G={mode,kind:mode.startsWith('501')?'x01':mode,players,cur:0,left:3,round:1,turnStart:0,turnSum:0,ending:false};
  $('#menu').classList.remove('show');$('#over').classList.remove('show');$('#mb').style.display='grid';
  startTurn();
}
function startTurn(){
  const p=G.players[G.cur];p.hits=[];G.left=3;G.turnStart=p.score;G.turnSum=0;G.ending=false;renderHUD();
  $('#hint').style.opacity=p.cpu?0:(thrown<3?1:0);
  if(G.mode==='501p')banner(T('turnOf',p.name),T('pass'),'');
  if(p.cpu)later(700,cpuAim);
}
function canAim(){return state==='play'&&G&&!G.ending&&!flight&&!cpu&&!collecting&&!G.players[G.cur].cpu&&G.left>0}
function aimPos(){
  const amp=(3.2+Math.max(0,Math.min(aim.hold-1.2,3))*4)*k,q=aim.hold+aim.ph;
  return{x:aim.x+amp*(Math.sin(q*1.7)+.5*Math.sin(q*3.3+1.3)),y:aim.y+amp*(Math.cos(q*1.25)+.5*Math.sin(q*2.9))};
}
function throwAt(x,y,col){
  flight={x0:handX(),y0:handY(),x,y,t:0,dur:.36,col,spin:rnd(0,6)};snd('whoosh');
  if(!G.players[G.cur].cpu){thrown++;$('#hint').style.opacity=0}
}
function land(f){
  flight=null;const mx=(f.x-cx)/k,my=(f.y-cy)/k,r=Math.hypot(mx,my),res=scoreAt(mx,my);
  if(r<=EXT*.97){
    darts.push({x:mx,y:my,rot:(mx/RN)*.35+rnd(-.09,.09),col:f.col,t:0});
    snd(res.v?'thud':'soft');if(res.m===3||res.v===50)snd('ding');
    shake=RM?0:(res.v?2.4:1.3);burst(f.x,f.y,res);
  }else{parts.push({k:'dart',x:f.x,y:f.y,vx:rnd(-40,40),vy:-80,g:900,rot:0,vr:rnd(-8,8),col:f.col,life:1.6,max:1.6});snd('miss')}
  onHit(res);
}
function onHit(res){
  const p=G.players[G.cur];p.darts++;G.left--;let bust=false,win=false;
  if(G.kind==='x01'){const nr=p.score-res.v;
    if(nr<0||(settings.dbl&&(nr===1||(nr===0&&res.m!==2))))bust=true;
    else{p.score=nr;G.turnSum+=res.v;p.total+=res.v;if(nr===0)win=true}
    popup(res.lab,bust?T('bust'):(res.v?'+'+fa(res.v):fa(0)),bust?'bad':!res.v?'miss':(res.m===3||res.v===50)?'hot':'')}
  else if(G.kind==='atc'){const tg=p.target,ok=tg===21?(res.n===25||res.n===50):(res.n===tg&&res.m>0);
    if(ok){p.target++;G.turnSum++;p.score++;if(p.target>21)win=true}
    popup(res.lab,ok?(win?T('done'):T('next',tgName(p.target))):T('wrong'),ok?'hot':'bad')}
  else{p.score+=res.v;G.turnSum+=res.v;p.total+=res.v;popup(res.lab,res.v?'+'+fa(res.v):fa(0),!res.v?'miss':(res.m===3||res.v===50)?'hot':'')}
  p.hits.push(res.chip);
  if(bust){p.total-=G.turnSum;p.score=G.turnStart;G.turnSum=0}
  renderHUD();
  if(bust||win||G.left===0){G.ending=true;later(780,()=>endTurn(bust,win))}
  else if(p.cpu)later(620,cpuAim);
}
const tgName=n=>n>=21?T('bull'):fa(n);
function popup(main,tag,cls){
  const el=$('#pop');el.className=cls||'';el.querySelector('b').textContent=main;
  el.querySelector('span').textContent=tag;void el.offsetWidth;el.classList.add('go');
}
function banner(txt,sub,cls){const el=$('#banner');el.className=cls||'';el.querySelector('b').textContent=txt;el.querySelector('small').textContent=sub;void el.offsetWidth;el.classList.add('go')}
function endTurn(bust,win){
  const p=G.players[G.cur];
  if(win){
    const wt=G.kind==='atc'?T('done'):p.cpu?T('cpuWon'):G.mode==='501p'?T('nWon',p.name):T('youWon');
    const ws=G.kind==='atc'?T('inDarts',fa(p.darts)):p.cpu?T('nextTime'):T('x01done');
    banner(wt,ws,'gold');snd('cheer');confetti();later(1700,()=>gameOver(p));return}
  if(G.kind==='atc')banner(T('ofThree',fa(G.turnSum)),T('nextTarget',tgName(p.target)),G.turnSum===3?'gold':'');
  else if(bust){banner(T('bust'),T('bustSub',p.name),'bad');snd('bust')}
  else if(G.turnSum===180){banner(fa(180),T('max'),'gold');snd('cheer');confetti()}
  else banner(T('pts',fa(G.turnSum)),p.name,G.turnSum>=100?'gold':'');
  later(1150,()=>{collecting=.35;collectCb=nextPlayer;snd('pull')});
}
function nextPlayer(){
  G.cur=(G.cur+1)%G.players.length;
  if(G.cur===0){G.round++;if(G.mode==='count'&&G.round>8){gameOver();return}}
  startTurn();
}
function solve(rem){
  if(settings.dbl){
    if(rem===50)return tp(50);
    if(rem<=40&&rem%2===0)return tp(rem/2,'D');
    if(rem<=60)for(let s=20;s>=1;s--){const l=rem-s;if(l>=2&&l<=40&&l%2===0)return tp(s,'S')}
    if(rem<=100)for(let s=20;s>=1;s--){const l=rem-3*s;if(l>=2&&l<=40&&l%2===0)return tp(s,'T')}
    return tp(20,'T');
  }
  if(rem===50||rem===25)return tp(50);
  if(rem<=20)return tp(rem,'S');
  if(rem<=60&&rem%3===0)return tp(rem/3,'T');
  if(rem<=40&&rem%2===0)return tp(rem/2,'D');
  if(rem<60)return tp(20,'S');
  return tp(20,'T');
}
function cpuAim(){
  const p=G.players[G.cur];
  cpu={from:cpuLast||{x:rnd(-80,80),y:rnd(60,150)},to:G.mode==='501'?solve(p.score):tp(20,'T'),t:0,dur:.75,col:p.col};
}
function gameOver(winner){
  state='over';$('#mb').style.display='none';let h='';
  if(G.kind==='x01'){
    $('#ovT').textContent=winner.cpu?T('cpuWon'):G.mode==='501p'?T('nWon',winner.name):T('youWon');
    h=G.players.map(p=>`<div class="st"><span>${T('avg3',p.name)}</span><b>${fa(p.darts?(p.total/p.darts*3).toFixed(1):0)}</b></div>`).join('')+
      G.players.filter(p=>!p.cpu).map(p=>`<div class="st"><span>${T('dartsOf',p.name)}</span><b>${fa(p.darts)}</b></div>`).join('');
  }else if(G.kind==='atc'){
    const d=G.players[0].darts,best=store.get('darts-atc',0),rec=!best||d<best;if(rec)store.set('darts-atc',d);
    $('#ovT').textContent=rec?T('newRec'):T('atcDone');
    h=`<div class="st"><span>${T('nDarts')}</span><b>${fa(d)}</b></div><div class="st"><span>${T('acc')}</span><b>${fa(Math.round(21/d*100))}${T('pct')}</b></div><div class="st"><span>${T('bestFew')}</span><b>${fa(rec?d:best)}</b></div>`;
  }else{
    const sc=G.players[0].score,best=store.get('darts-best',0),rec=sc>best;if(rec)store.set('darts-best',sc);
    $('#ovT').textContent=rec?T('newRec'):T('gameOver');
    h=`<div class="st"><span>${T('final')}</span><b>${fa(sc)}</b></div><div class="st"><span>${T('avgRound')}</span><b>${fa((sc/8).toFixed(1))}</b></div><div class="st"><span>${T('best')}</span><b>${fa(Math.max(sc,best))}</b></div>`;
  }
  $('#ovS').innerHTML=h;$('#over').classList.add('show');
}
function showMenu(){gid++;state='menu';G=null;darts=[];flight=null;aim=null;cpu=null;collecting=0;renderHUD();
  $('#over').classList.remove('show');$('#menu').classList.add('show');$('#mb').style.display='none';$('#hint').style.opacity=0}
function renderHUD(){
  if(!G){hud.innerHTML='';return}
  let h=G.players.map((p,i)=>{
    const chips=[0,1,2].map(j=>`<span class="chip">${p.hits[j]||''}</span>`).join('');
    const sub=G.kind==='x01'?T('avg',fa(p.darts?(p.total/p.darts*3).toFixed(1):0)):G.kind==='atc'?T('throws',fa(p.darts)):T('round',fa(Math.min(G.round,8)),fa(8));
    const big=G.kind==='atc'?T('target',tgName(Math.min(p.target,21))):fa(p.score);
    return`<div class="card ${i===G.cur?'on':''}"><div class="top"><span><i class="dot" style="background:${p.col};color:${p.col}"></i>${p.name}</span><span class="sub">${sub}</span></div><div class="big">${big}</div><div class="chips">${chips}</div></div>`}).join('');
  const nth=`<span class="chip">${T('nth',fa(Math.min(3,4-G.left)),fa(3))}</span>`;
  if(G.kind==='count')h+=`<div class="card"><div class="top"><span>${T('yourRec')}</span><span class="sub">${T('throws24')}</span></div><div class="big">${fa(store.get('darts-best',0))}</div><div class="chips">${nth}</div></div>`;
  if(G.kind==='atc'){const b=store.get('darts-atc',0);h+=`<div class="card"><div class="top"><span>${T('yourRec')}</span><span class="sub">${T('fewest')}</span></div><div class="big">${b?fa(b):'—'}</div><div class="chips">${nth}</div></div>`}
  hud.innerHTML=h;
}

/* ---------- particles ---------- */
function burst(x,y,res){
  const n=res.v?12:6;
  for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(30,140);parts.push({k:'dust',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,g:260,r:rnd(.8,2.2),c:Math.random()<.5?'#e9dcc0':'#6b5a45',life:.55,max:.55})}
  if(res.m===3||res.v===50)for(let i=0;i<22;i++){const a=rnd(0,7),v=rnd(80,260);parts.push({k:'dust',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:120,r:rnd(1,2.6),c:Math.random()<.5?'#ffd45a':'#fff1c4',life:.7,max:.7})}
}
function confetti(){const cs=['#f5c451','#e0253f','#14a052','#ffffff','#2f7bf0'];
  for(let i=0;i<140;i++)parts.push({k:'conf',x:rnd(0,W),y:rnd(-H*.3,-10),vx:rnd(-40,40),vy:rnd(60,200),g:60,rot:rnd(0,7),vr:rnd(-9,9),w:rnd(5,10),h:rnd(3,6),c:cs[i%5],life:3,max:3})}

/* ---------- loop ---------- */
function update(dt){
  t+=dt;if(aim)aim.hold+=dt;shake*=Math.exp(-dt*9);
  for(const d of darts)d.t+=dt;
  if(flight){flight.t+=dt/flight.dur;if(flight.t>=1)land(flight)}
  if(cpu){cpu.t+=dt;if(cpu.t>=cpu.dur+.3){const sig=[30,18,10.5][settings.diff],x=cpu.to.x+gauss()*sig,y=cpu.to.y+gauss()*sig;cpuLast=cpu.to;const c=cpu.col;cpu=null;throwAt(cx+x*k,cy+y*k,c)}}
  if(collecting){collecting-=dt;if(collecting<=0){collecting=0;darts=[];const f=collectCb;collectCb=null;if(f&&state==='play')f()}}
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.vr)p.rot+=p.vr*dt}
  parts=parts.filter(p=>p.life>0);
}
function cpuPos(){const e=Math.min(1,cpu.t/cpu.dur),q=1-Math.pow(1-e,3),sw=2.5*k;
  return{x:cx+(cpu.from.x+(cpu.to.x-cpu.from.x)*q)*k+Math.sin(t*2.3)*sw,y:cy+(cpu.from.y+(cpu.to.y-cpu.from.y)*q)*k+Math.cos(t*1.9)*sw}}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(bgC,0,0,W,H);
  ctx.save();ctx.translate(shake*Math.sin(t*70),shake*Math.cos(t*63));
  ctx.drawImage(boardC,cx-Rt,cy-Rt,2*Rt,2*Rt);
  if(G&&G.kind==='atc'&&G.players[0].target<=21){
    const tg=G.players[0].target,pu=.5+.5*Math.sin(t*4);ctx.beginPath();
    if(tg===21)ctx.arc(cx,cy,ROB*k,0,7);
    else{const c=(-90+ORDER.indexOf(tg)*18)*DEG;ctx.arc(cx,cy,DO*k,c-9*DEG,c+9*DEG);ctx.arc(cx,cy,ROB*k,c+9*DEG,c-9*DEG,true);ctx.closePath()}
    ctx.fillStyle=`rgba(255,205,70,${.16+.16*pu})`;ctx.fill();
    ctx.save();ctx.shadowColor='#ffcc40';ctx.shadowBlur=12+10*pu;ctx.strokeStyle=`rgba(255,220,110,${.7+.3*pu})`;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  }
  const ca=collecting?collecting/.35:1;
  for(const d of darts){const x=cx+d.x*k,y=cy+d.y*k+(1-ca)*24,wob=Math.sin(d.t*38)*.13*Math.exp(-d.t*7);dartShadow(ctx,x,y,s0,d.rot,ca);drawDart(ctx,x,y,s0,d.rot+wob,d.col,1,ca)}
  ctx.restore();
  for(const p of parts){const a=Math.max(0,p.life/p.max);
    if(p.k==='dust'){ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1}
    else if(p.k==='conf'){ctx.save();ctx.globalAlpha=Math.min(1,a*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.rot*2));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    else drawDart(ctx,p.x,p.y,s0,p.rot,p.col,1,Math.min(1,a*2))}
  if(flight){const f=flight,e=f.t,pos=q=>({x:f.x0+(f.x-f.x0)*q,y:f.y0+(f.y-f.y0)*q-Math.sin(Math.PI*q)*Math.min(H*.12,90)});
    const a=pos(e),b=pos(Math.min(1,e+.03)),rot=e>.96?0:Math.atan2(b.x-a.x,-(b.y-a.y))*(1-e*.7);
    drawDart(ctx,a.x,a.y,hs+(s0-hs)*Math.pow(e,.65),rot,f.col,.55+.45*Math.abs(Math.cos(f.spin+e*14)),1)}
  if(state==='play'&&G){
    const p=G.players[G.cur];
    if(!p.cpu&&!flight&&!G.ending&&!collecting&&G.left>0){
      for(let j=1;j<G.left;j++)drawDart(ctx,W/2-j*hs*13-hs*14,handY()+hs*12,hs*.62,-.12,p.col,1,.75);
      drawDart(ctx,handX(),handY(),hs,aim?(aim.x-W/2)/W*.3:0,p.col,1,1);
    }
    if(aim){const q=aimPos();cross(q.x,q.y,'#ff3b4e')}
    if(cpu){const q=cpuPos();cross(q.x,q.y,'#3b8bff')}
  }
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- input & ui ---------- */
cv.addEventListener('pointerdown',e=>{audioInit();if(!canAim())return;const off=e.pointerType==='touch'?-Math.min(90,R*.5):0;
  aim={x:e.clientX,y:e.clientY+off,off,hold:0,id:e.pointerId,ph:rnd(0,10)};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(aim&&e.pointerId===aim.id){aim.x=e.clientX;aim.y=e.clientY+aim.off}});
addEventListener('pointerup',e=>{if(aim&&e.pointerId===aim.id){const q=aimPos(),sp=2.2*k;aim=null;if(canAim())throwAt(q.x+gauss()*sp,q.y+gauss()*sp,G.players[G.cur].col)}});
addEventListener('pointercancel',()=>{aim=null});
addEventListener('resize',resize);
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{audioInit();snd('click');newGame(b.dataset.mode)}));
const seg=$('#diff');
function paintSeg(){seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===settings.diff))}
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;settings.diff=+b.dataset.v;store.set('darts-set',settings);paintSeg();snd('click')});
const dbl=$('#dbl'),sn=$('#snd');dbl.checked=settings.dbl;sn.checked=settings.snd;
dbl.addEventListener('change',()=>{settings.dbl=dbl.checked;store.set('darts-set',settings);snd('click')});
sn.addEventListener('change',()=>{settings.snd=sn.checked;store.set('darts-set',settings);snd('click')});
$('#again').addEventListener('click',()=>{snd('click');newGame(G?G.mode:'501')});
$('#toMenu').addEventListener('click',()=>{snd('click');showMenu()});
$('#mb').addEventListener('click',()=>{snd('click');showMenu()});
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;settings.lang=b.dataset.v;store.set('darts-set',settings);applyLang();snd('click')});
applyLang();paintSeg();resize();$('#hint').style.opacity=0;
if(document.fonts&&document.fonts.load)document.fonts.load('900 25px Vazirmatn').then(()=>makeBoard()).catch(()=>{});
requestAnimationFrame(loop);
}
</script>
